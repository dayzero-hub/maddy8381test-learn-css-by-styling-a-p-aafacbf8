<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1 class="card__heading">Payment</h1>

      <p class="card__amount">$1,250.00</p>

      <span class="card__status card__status--paid">Paid</span>

      <dl class="card__details">
        <div class="card__row">
          <dt class="card__label">To</dt>
          <dd class="card__value">Acme Corp</dd>
        </div>
        <div class="card__row">
          <dt class="card__label">Date</dt>
          <dd class="card__value">15 Sep 2026</dd>
        </div>
        <div class="card__row">
          <dt class="card__label">Transaction ID</dt>
          <dd class="card__value">txn_8f2a91c4d3e0</dd>
        </div>
      </dl>
    </div>
  </body>
</html>
